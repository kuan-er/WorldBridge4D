# H017 large decoder arm: 75,487,747 decoder parameters.
# The Wan/geometry route is held fixed across all three arms; only decoder width/depth changes.
data_root: /dataset/MOVi-F
wan_root: /dataset/Wan2.1-T2V-1.3B
empty_text_condition: /tmp/worldbridge_dense4d/wan_empty_condition.pt
coordinate_stats: /tmp/worldbridge_dense4d/coordinate_stats_train_source.npz
coordinate_frame: source
clip_length: 21
clip_start: 0
image_size: 128
max_clips: null
num_query_pairs: 21
pair_sampling: source_all_targets
evaluation_pairs: [[0, 0], [7, 7], [20, 20], [0, 1], [0, 20], [7, 14], [20, 0], [14, 7], [20, 19], [3, 18]]

backbone_readout: wan_hidden_structured
wan_hidden_layers: [13, 14, 15]
geometry_dim: 128
geometry_spatial_size: 16
geometry_num_heads: 8
geometry_clean_skip: true
motion_slots: 8
structured_local_queries: true

query_dim: 1024
embedding_dim: 512
num_cross_attn_layers: 5
num_heads: 8
upsample_channels: [1024, 512, 256, 128]

# Capacity curve predicts 76.82 GiB at batch 12 from measured batches 1..8.
batch_size: 12
steps: 30000
matched_epoch_sampling: true
learning_rate: 0.0003
geometry_learning_rate: 0.0003
backbone_learning_rate: 0.00005
warmup_steps: 256
weight_decay: 0.0001
precision: bf16
gradient_checkpointing: true
gradient_accumulation: 1
gradient_clip: 1.0
trainable_mode: full
seed: 2029
geometry_seed: 2026
decoder_seed: 424242
smooth_l1_beta: 0.05
geometry_cache_entries: 1024
sample_cache: /tmp/worldbridge_dense4d_matched/cache/movif_train_clip21_start0_samples.pkl
clean_latent_cache: /data/WorldBridge4D-persistent/h017_decoder_capacity/cache/movif_train_clip21_start0_seed2029_clean_latents.pt
save_checkpoint: true
keep_checkpoint: true
checkpoint_every_steps: 5000
tracking:
  enabled: true
  project: worldbridge4d
  entity: zhaigong2023-sjtu-hpc-center
  group: h017-decoder-capacity-30k
  tags: [h017, decoder-75m, batch12, all5737, source-all-targets, full-dit, steps30000, seed2029]
  log_every: 20
