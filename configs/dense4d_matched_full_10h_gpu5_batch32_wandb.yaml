# H004 approximately 10-hour GPU-5 optimization run with explicit W&B curves.
# Batch 32 smoke used 63.96 GiB and completed without OOM.
data_root: /dataset/MOVi-F
wan_root: /dataset/Wan2.1-T2V-1.3B
