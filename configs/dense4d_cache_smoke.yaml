# Two-clip persistent decoded-sample and clean-latent cache smoke.
data_root: /dataset/MOVi-F
wan_root: /dataset/Wan2.1-T2V-1.3B
empty_text_condition: /tmp/worldbridge_dense4d_matched/wan_empty_condition.pt
coordinate_stats: /tmp/worldbridge_dense4d_matched/coordinate_stats_train.npz
sample_cache: /tmp/worldbridge_dense4d_matched/cache_smoke/samples.pkl
clean_latent_cache: /tmp/worldbridge_dense4d_matched/cache_smoke/latents.pt
clip_length: 21
clip_start: 0
image_size: 128
max_clips: 2
num_query_pairs: 3
pair_sampling: h001_balanced
evaluation_pairs: [[0, 0], [0, 20], [20, 0]]
query_dim: 256
embedding_dim: 128
num_cross_attn_layers: 2
num_heads: 8
upsample_channels: [256, 128, 64, 32]
batch_size: 1
steps: 1
matched_epoch_sampling: true
learning_rate: 0.001
backbone_learning_rate: 0.000005
weight_decay: 0.0001
precision: bf16
gradient_checkpointing: true
gradient_accumulation: 1
