# PointOdyssey H020: three physical GPUs (2,4,6), global 100k optimizer steps.
# Historical filename retains "30k"; the resolved steps field is authoritative.
data_root: /dataset/PointOdyssey
cache_root: /data/WorldBridge4D-persistent/pointodyssey_worldbridge4d_v1
latent_root: /data/WorldBridge4D-persistent/pointodyssey_worldbridge4d_v1/latents/train
wan_root: /data/WorldBridge4D/Wan2.1-T2V-1.3B
empty_text_condition: /tmp/worldbridge_dense4d/wan_empty_condition.pt
clip_length: 21
image_size: 128
coordinate_frame: source
backbone_readout: wan_hidden_structured
wan_hidden_layers: [13, 14, 15]
geometry_dim: 512
geometry_spatial_size: 16
geometry_num_heads: 8
geometry_clean_skip: true
motion_slots: 8
structured_local_queries: true
query_dim: 1024
embedding_dim: 512
num_cross_attn_layers: 5
num_heads: 8
upsample_channels: [1024, 512, 256, 128]
# H013 reference is batch 1; this is the largest conservative full-100M arm.
# The launcher keeps the cards occupied during cache creation and does not
# silently increase this after training has started.
batch_size_per_gpu: 1
steps: 100000
learning_rate: 0.0003
geometry_learning_rate: 0.0003
backbone_learning_rate: 0.00005
warmup_steps: 256
weight_decay: 0.0001
precision: bf16
gradient_checkpointing: true
gradient_clip: 1.0
trainable_mode: full
seed: 2029
geometry_seed: 2026
decoder_seed: 424242
smooth_l1_beta: 0.05
geometry_prefetch_workers: 8
geometry_prefetch_depth: 2
diagnostic_every_steps: 20
checkpoint_every_steps: 5000
tracking:
  enabled: true
  project: worldbridge4d
  entity: zhaigong2023-sjtu-hpc-center
  group: pointodyssey-dense4d-ddp-100k
  tags: [h020, pointodyssey, source-frame, dense4d, ddp, 3gpu]
