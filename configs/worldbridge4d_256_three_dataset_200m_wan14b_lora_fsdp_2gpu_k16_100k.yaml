# H026 matched two-rank K=16 trajectory. Wan14B is executed through its true
# final transformer block 39 and is staged on node-local /tmp before launch.
image_size: 256
clip_length: 21
latent_spatial_size: 32
coordinate_frame: source

wan_root: /tmp/worldbridge4d-models/Wan2.1-T2V-14B
wan_dit_root: /tmp/worldbridge4d-models/Wan2.1-T2V-14B
vae_checkpoint: /tmp/worldbridge4d-models/Wan2.1-T2V-14B/Wan2.1_VAE.pth
wan_num_layers: 40
wan_truncate_after_block: 39
backbone_readout: wan_hidden_structured
wan_hidden_layers: [13, 14, 15, 39]
layer_gate_initial_logits: [0.0, 0.0, 0.0, -1.0986122887]
layer_gate_temperature: 1.0
layer_gate_top_k: 4
geometry_dim: 512
geometry_spatial_size: 32
geometry_num_heads: 8
geometry_clean_skip: true
motion_slots: 8
structured_local_queries: true

query_dim: 1536
embedding_dim: 768
num_cross_attn_layers: 5
num_heads: 12
query_grid_size: 32
upsample_channels: [1536, 768, 384, 192]
# The four hidden-state projections widen from Wan1.3B's 1536 to Wan14B's 5120.
expected_non_wan_parameters: 200955397

precision: bf16
trainable_mode: lora
lora_rank: 16
lora_alpha: 16
lora_dropout: 0.0
lora_targets: [to_q, to_k, to_v, to_out.0, ffn.net.0.proj, ffn.net.2]
fsdp: full_shard
fsdp_min_num_params: 5000000
microbatch_per_gpu: 2
gradient_accumulation: 2
targets_per_source: 16
geometry_prefetch_depth: 4
geometry_prefetch_workers: 8

learning_rate: 0.0003
geometry_learning_rate: 0.0003
backbone_learning_rate: 0.00005
weight_decay: 0.0001
warmup_steps: 1000
lr_schedule: cosine
schedule_horizon_steps: 100000
max_steps: 100000
gradient_clip: 1.0
smooth_l1_beta: 0.05
gradient_checkpointing: true
seed: 20260812
geometry_seed: 20260812
decoder_seed: 424242

checkpoint_steps: [50, 100, 250, 500, 1000, 2000, 5000, 10000]
checkpoint_every_after: 5000
checkpoint_keep_last: 2
diagnostic_every_steps: 5
graceful_stop_hours: 1000
pipeline_wait_timeout_seconds: 3600

# Gate-only bootstrap mixture statistics. The formal run remains blocked on
# full train-only mixture statistics and complete immutable latent shards.
mixture_coordinate_stats: /data/WorldBridge4D-runs/worldbridge4d_256_two_gpu_gate_b2_k16_a2/coordinate_stats_gate_bootstrap.npz
text_conditions:
  kubric: /data/WorldBridge4D-persistent/worldbridge4d_256_three_dataset_v1/text_conditions/kubric.pt
  pointodyssey: /data/WorldBridge4D-persistent/worldbridge4d_256_three_dataset_v1/text_conditions/pointodyssey.pt
  dynamic_replica: /data/WorldBridge4D-persistent/worldbridge4d_256_three_dataset_v1/text_conditions/dynamic_replica.pt
  metadata: /data/WorldBridge4D-persistent/worldbridge4d_256_three_dataset_v1/text_conditions/metadata.json
prompts:
  kubric: "Estimate dense three-dimensional point trajectories over time from this monocular video. The video shows multiple rigid objects moving independently in a rendered three-dimensional scene. The camera viewpoint may change over time, and objects may become occluded and reappear."
  pointodyssey: "Estimate dense three-dimensional point trajectories over time from this monocular video. The video shows articulated characters and objects undergoing diverse rigid and non-rigid motion in a rendered three-dimensional scene. The camera viewpoint may change over time, and objects may become occluded and reappear."
  dynamic_replica: "Estimate dense three-dimensional point trajectories over time from this monocular video. The video shows articulated people moving through a rendered furnished indoor three-dimensional scene. The camera viewpoint may change over time, and people may become occluded and reappear."

datasets:
  kubric:
    raw_root: /dataset/nas0/yejun/MOVi-F/512x512
    cache_root: /data/WorldBridge4D-persistent/worldbridge4d_256_three_dataset_v1/kubric
    geometry_mmap_root: /tmp/worldbridge4d-cache-v2/kubric_geometry_mmap
  pointodyssey:
    raw_root: /dataset/nas0/PointOdyssey
    geometry_cache_root: /data/WorldBridge4D-persistent/pointodyssey_worldbridge4d_v1
    cache_root: /data/WorldBridge4D-persistent/worldbridge4d_256_three_dataset_v1/pointodyssey
  dynamic_replica:
    raw_root: /dataset/data/Dynamic_dataset/dynamic_stereo
    geometry_cache_root: /data/WorldBridge4D-persistent/datasets/dynamic_stereo_worldbridge4d_v1
    cache_root: /data/WorldBridge4D-persistent/worldbridge4d_256_three_dataset_v1/dynamic_replica

tracking:
  enabled: true
  project: worldbridge4d
  entity: zhaigong2023-sjtu-hpc-center
  group: worldbridge4d-256-wan14b-full40-lora-two-gpu-b2-k16-a2-100k
  tags: [h026, wan14b, full40, final-block39, lora-r16, 256px, 200m-readout, three-dataset, fsdp, full-shard, two-gpu-experiment, lazy-vae-cache, microbatch2, accumulation2, k16, fresh-100k]
