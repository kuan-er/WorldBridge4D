mode: compact
seed: 7
output_dir: artifacts/smoke
data:
  root: /dataset/MOVi-F
  clip_length: 21
  clip_start: 0
  max_examples: 1
  stats_examples: 1
  depth_tolerance: 0.05
  depth_relative_tolerance: 0.01
model:
  latent_channels: 16
  latent_time: 6
  latent_height: 16
  latent_width: 16
  trajectory_channels: 8
  trajectory_hidden: 16
  trajectory_time_dim: 8
  reconstruction_channels: 8
  context_hidden: 16
  decoder_hidden: 32
train:
  steps: 1
  queries_per_step: 32
  trajectory_block_size: 16384
  learning_rate: 0.001
  weight_decay: 0.0
  amp: true
  gradient_accumulation: 1
  gradient_clip: 1.0
  fixed_queries: true
  log_every: 1
